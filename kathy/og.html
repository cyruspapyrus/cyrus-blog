<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&family=Instrument+Serif&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;display:flex;background:#0D1B2A;overflow:hidden}
.ph{width:472px;height:630px;flex:none;position:relative;background:#E9E2D5}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(13,27,42,0) 70%,rgba(13,27,42,.9) 100%)}
.tx{flex:1;padding:72px 72px 72px 64px;display:flex;flex-direction:column;justify-content:center}
.eb{font:600 17px/1 "Instrument Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#C2A36B;margin-bottom:28px}
h1{font:400 82px/1.02 "Instrument Serif",serif;color:#F5F0E8;letter-spacing:-.01em}
.sub{margin-top:26px;font:400 27px/1.4 "Instrument Serif",serif;color:#A9B4C0}
.rule{width:64px;height:1px;background:#C2A36B;margin:36px 0 26px}
.ft{font:600 15px/1 "Instrument Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A9B4C0}
</style></head>
<body>
  <div class="ph"><img src="img/p04.jpg" alt=""></div>
  <div class="tx">
    <div class="eb">Creative Director, Smile+</div>
    <h1>Kathy Estrada</h1>
    <div class="sub">Luxury wellness, fitness and travel.</div>
    <div class="rule"></div>
    <div class="ft">Five partnerships &middot; 2027 &middot; cyrus.blog/kathy</div>
  </div>
</body></html>
